# fix terminal colors in tmux
set-option -sa terminal-overrides ",xterm*:Tc"

# help pi
set -g extended-keys-format csi-u
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# allow arrow keys
set-window-option -g xterm-keys on

# send plain Backspace for Shift+Backspace (extended-keys would send CSI u)
bind -T root S-BSpace send-keys BSpace

# Reload config with r
unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-a
unbind C-b

# prefix + Ctrl-a toggles to the last session; prefix + a sends a literal Ctrl-a
bind C-a switch-client -l
bind a send-prefix

# Name the first window of every new session "main"
set-hook -g session-created 'rename-window main'

# When creating a new window, start with an empty name.
# Then the status format below shows only the index (#I) unless
# you manually rename it (Prefix + ,).
bind c new-window -n ''

# Enable mouse support, can resize panes using mouse
set -g mouse on

# Alt+1-9 selects windows 1-9, Alt+0 selects window 10 (sent by Ghostty's Cmd+1-0)
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :10

bind p previous-window

##### Popups #####

set -g popup-style "bg=#1f1f28,fg=#dcd7ba"
set -g popup-border-style "fg=#7e9cd8"

# prefix + g lazygit, o opencode, P pi, t shell, u home shell, D dotfiles shell (all in pane's dir unless noted)
bind g display-popup -d "#{pane_current_path}" -w 85% -h 85% -E lazygit
bind o display-popup -d "#{pane_current_path}" -w 85% -h 85% -E opencode
bind P display-popup -d "#{pane_current_path}" -w 85% -h 85% -E pi
bind t display-popup -d "#{pane_current_path}" -w 75% -h 75% -E zsh
bind u display-popup -d "$HOME" -w 75% -h 75% -E zsh
bind D display-popup -d "$HOME/.dotfiles" -w 75% -h 75% -E zsh
bind Space display-popup -w 70% -h 70% -E "~/.tmux/scripts/session-picker.sh"
bind f display-popup -w 80% -h 80% -E "~/.tmux/scripts/pane-picker.sh"
bind - display-popup -w 70% -h 70% -E "~/.tmux/scripts/src-window.sh"
bind w display-popup -w 70% -h 70% -E "~/.tmux/scripts/worktree-window.sh"
bind = display-popup -w 70% -h 70% -E "~/.tmux/scripts/src-session.sh"

# Easier window splits
bind v split-window -h
bind s split-window -v

# vim keybindings for moving around panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# map capital Vim movement keys to resize windows
bind-key J resize-pane -D
bind-key K resize-pane -U
bind-key H resize-pane -L
bind-key L resize-pane -R

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Upgrade $TERM
set -g default-terminal "screen-256color"

# Focus events enabled for terminals that support them
set -g focus-events on

# Put tmux window list at top of screen
set-option -g status-position top

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Disable automatic window renaming so custom names persist
set -g automatic-rename off

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# enable OCS-52
set -g set-clipboard on

# heavy pane border lines (tmux 3.2+)
set -g pane-border-lines heavy

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

set -g @plugin 'aaron-miller/tmux-ukiyo#feat/allow-short-hostnames'
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-plugins "ssh-session"
set -g @ukiyo-git-disable-status true
set -g @ukiyo-show-powerline true
set -g @ukiyo-show-ssh-session-port false
set -g @ukiyo-ssh-session-short-hostname true

# vim tmux navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line near the bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Pane borders: set after TPM, since tmux-ukiyo sets these styles when it loads
set -g pane-active-border-style "fg=#7e9cd8"
set -g pane-border-style "fg=#363646"
