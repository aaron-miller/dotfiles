# fix terminal colors in tmux
set-option -sa terminal-overrides ",xterm*:Tc"

# help pi
set -g extended-keys-format csi-u
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Reload config with r
unbind r
bind r source-file ~/.tmux.conf

# Rebind leader to ctrl-space
set -g prefix C-a
bind C-Space send-prefix
unbind C-b

# When creating a new window, start with an empty name.
# Then the status format below shows only the index (#I) unless
# you manually rename it (Prefix + ,).
bind c new-window -n ''

# Enable mouse support, can resize panes using mouse
set -g mouse on

# Easier window splits
bind v split-window -h
bind s split-window -v

bind w list-session

# vim keybindings for moving around panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# map capital Vim movement keys to resize windows
bind-key J resize-pane -D
bind-key K resize-pane -U
bind-key H resize-pane -L
bind-key L resize-pane -R

# swap between windows
bind-key C-Space last-window

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Upgrade $TERM
set -g default-terminal "screen-256color"

# Focus events enabled for terminals that support them
set -g focus-events on

# Put tmux window list at top of screen
set-option -g status-position top

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Disable automatic window renaming so custom names persist
set -g automatic-rename off

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# enable OCS-52
set -g set-clipboard on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

set -g @plugin 'aaron-miller/tmux-ukiyo#feat/allow-short-hostnames'
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-plugins "ssh-session kubernetes-context"
set -g @ukiyo-git-disable-status true
set -g @ukiyo-show-powerline true
set -g @ukiyo-kubernetes-hide-user true
set -g @ukiyo-kubernetes-eks-hide-arn true
set -g @ukiyo-kubernetes-eks-extract-account true
set -g @ukiyo-show-ssh-session-port false
set -g @ukiyo-ssh-session-short-hostname true

# vim tmux navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# copy to system clipboard with y
set -g @plugin 'tmux-plugins/tmux-yank'

# kube-tmux
set -g @plugin 'jonmosco/kube-tmux'

# tmux-floax
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'o'
set -g @floax-bind-menu 'O'
bind p previous-window

# tmux-sessionx
set -g @plugin 'omerxx/tmux-sessionx'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

